<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Blinker:wght@100;200;300;400;600;700;800;900&display=swap" rel="stylesheet">
  <title>Dashboard Financeiro</title>
</head>

<body data-theme="light">
  <header class="header" data-theme="light">
    <div class="container">
      <h1 class="page-title" data-theme="light">Dashboard financeiro</h1>
    </div>
  </header>
  <button id="theme-btn" aria-label="Ativar modo escuro" data-theme="light">
    <div>
      <img id="theme-icon" src="./img/icons/moon.svg" alt="" data-theme="light">
    </div>
  </button>

  <section class="form-cadastro">
    <form action="">
      <label for="valor">Valor</label>
      <input type="number" id="valor" placeholder="R$ 1.000,00">

      <select name="operacao" id="operacao">
        <option value="" disabled selected>Operação</option>
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>

      <select name="categoria" id="categoria">
        <option value="" disabled selected>Categoria</option>
        <option value="dividendo">Dividendo</option>
        <option value="jscp">JSCP</option>
        <option value="salario">Salário</option>
        <option value="adto-salario">Adto. salário</option>
      </select>

      <select name="conta" id="conta">
        <option value="" disabled selected>Conta</option>
        <option value="dinheiro">Dinheiro</option>
        <option value="itau">Itaú</option>
        <option value="inter">Inter</option>
        <option value="mercado-pago">Mercado Pago</option>
      </select>

      <input type="date">

      <button class="button" data-theme="light">CADASTRAR</button>
    </form>

  </section>
  <script type="module" src="./script.js"></script>
</body>

</html>
